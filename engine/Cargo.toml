[package]
name = "xiaoxue-engine"
version = "2.2.1"
edition = "2021"
description = "小雪工具箱业务引擎: ffmpeg 编排 / 元数据探测 / 批量工具 (框架无关)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
encoding_rs = "0.8"

[dev-dependencies]
tempfile = "3"
