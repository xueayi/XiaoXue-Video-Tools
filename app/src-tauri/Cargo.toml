[package]
name = "xiaoxue-app"
version = "2.3.0-dev"
edition = "2021"
description = "小雪工具箱 (Tauri 原生重写版)"

[lib]
name = "xiaoxue_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xiaoxue-engine = { path = "../../engine" }
