name: Rewrite CI

on:
  push:
    branches: ['rewrite/**']
    paths: ['engine/**', 'app/**', '.github/workflows/rewrite.yml']
  pull_request:
    paths: ['engine/**', 'app/**', '.github/workflows/rewrite.yml']

jobs:
  engine:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-engine-${{ hashFiles('engine/Cargo.toml', 'engine/Cargo.lock') }}

      - name: Test
        run: cargo test --all

      - name: Clippy
        run: cargo clippy --all

  app:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: ${{ runner.os }}-app-${{ hashFiles('app/src-tauri/Cargo.toml', 'app/src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Check Tauri shell
        working-directory: app/src-tauri
        run: cargo check --all
