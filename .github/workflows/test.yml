name: Tests

# 测试门禁: main 与 feat/macos-alpha 的 push / pull_request 时运行。
# 只在分支上触发 —— tag 构建由 build.yml / build-beta.yml 负责, 三者互不冲突。
on:
  push:
    branches: [main, feat/macos-alpha]
  pull_request:
    branches: [main, feat/macos-alpha]
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: read

# 同一分支/PR 的旧运行自动取消, 避免排队浪费 runner
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }} / Python 3.12)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # macOS 改用 uv 托管的 CPython 3.12.12, 与 build-macos / build-beta 的
      # 构建运行时保持一致。setup-python 提供的 macOS 构建不是 framework build,
      # PyQt6 在离屏 QApplication 初始化时会直接 abort (进程退出码 134),
      # 表现为 pytest 刚跑几秒就整体崩溃、且没有任何用例级失败信息。
      - name: Set up uv (macOS)
        if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.7'

      - name: Prepare uv Python 3.12 (macOS)
        if: runner.os == 'macOS'
        run: |
          uv python install 3.12.12
          uv venv --python 3.12.12 build/ci-venv
          echo "$PWD/build/ci-venv/bin" >> "$GITHUB_PATH"

      - name: Set up Python 3.12 (Windows)
        if: runner.os != 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            uv pip install --python build/ci-venv/bin/python \
              -r requirements.txt -r requirements-dev.txt
          else
            python -m pip install --upgrade pip
            pip install -r requirements.txt -r requirements-dev.txt
          fi

      # 不需要下载 FFmpeg: 测试全部 mock 真实二进制, 不依赖 ffmpeg/ffprobe。
      # - core / compat_encoder / media_probe / qc 的执行路径在测试中均被 mock;
      # - tests/process 的 QProcess 用例只启动 `python -c ...` 子进程;
      # - tests/capabilities 通过注入 fake ffmpeg 探测结果驱动, 不调用真实 ffmpeg;
      # - tests/test_updater.py 只调用系统自带的 PowerShell (windows-latest 已有)。
      # 因此这里不安装/下载 FFmpeg, 门禁保持轻量, 也不受发行版二进制版本影响。
      #
      # 输出同时落盘: 进程级崩溃 (SIGABRT / qFatal) 时日志仍可被下一步读取。
      - name: Run tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          XIAOXUE_NO_UPDATE_CHECK: '1'
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rf 2>&1 | tee pytest.log

      # 原生崩溃 (exit 134) 时检查页只有一行退出码, 看不出坏在哪个用例。
      # 把日志尾部转成注解, 失败原因直接显示在 commit / PR 的 Checks 里。
      - name: Surface failure details
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import pathlib

          log = pathlib.Path("pytest.log")
          if not log.exists():
              print("::error title=pytest::未生成 pytest.log, 进程可能在启动阶段崩溃")
              raise SystemExit(0)
          lines = [line.strip() for line in
                   log.read_text(encoding="utf-8", errors="replace").splitlines()
                   if line.strip()]
          for line in lines[-10:]:
              print("::error title=pytest::%s" % line[:300])
          PY
