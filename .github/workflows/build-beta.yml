name: Build Pre-release

on:
  push:
    tags: ['v*-alpha*', 'v*-beta*', 'v*-rc*']
  workflow_dispatch:
    inputs:
      version:
        description: '预发布版本号'
        required: true
        default: 'v2.3.0-alpha.2'

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
  QT_QPA_PLATFORM: offscreen
  XIAOXUE_NO_UPDATE_CHECK: '1'
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt "pyinstaller>=6.11.1,<7"
      - name: Download pinned FFmpeg and verify SHA256
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-16-13-04/ffmpeg-N-127579-g5cb9fcd211-win64-gpl.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          if ((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower() -ne 'b7c94a054ae4c1cce0e11ae18979d932e6f129ba6f5253b328227b31f1bf2bbf') {
            throw 'FFmpeg SHA256 校验失败'
          }
          Expand-Archive ffmpeg.zip ffmpeg_temp
          $directory = (Get-ChildItem ffmpeg_temp -Directory | Select-Object -First 1).FullName
          Copy-Item "$directory/bin/ffmpeg.exe", "$directory/bin/ffprobe.exe" bin/
      - name: Test including real media
        run: python -m pytest -ra
      - name: Inject tag version
        shell: python
        run: |
          import os, pathlib, re
          tag = os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'v\d+\.\d+\.\d+-(?:alpha|beta|rc)(?:\.[0-9A-Za-z-]+)*', tag):
              raise SystemExit('无效的预发布版本号')
          path = pathlib.Path('src/_version.py')
          path.write_text(re.sub(r'__version__:\s*str\s*=.*', f'__version__: str = {tag[1:]!r}', path.read_text(encoding='utf-8')), encoding='utf-8')
      - name: Build
        run: python -m PyInstaller XiaoXueToolbox.spec --noconfirm
      - name: Smoke test frozen preview and startup
        run: |
          Copy-Item -Path 'dist/小雪工具箱' -Destination 'build/windows-smoke-app' -Recurse
          python tools/smoke_windows.py --app build/windows-smoke-app
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path 'dist/小雪工具箱/*' -DestinationPath ('XiaoXueToolbox_{0}_Windows_x64.zip' -f $env:RELEASE_VERSION)
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: XiaoXueToolbox_*_Windows_x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-windows
          path: build/windows-smoke/
          if-no-files-found: ignore

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
          architecture: arm64
          cache: pip
          cache-dependency-path: requirements-build-macos.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-build-macos.txt -r requirements-dev.txt
      - name: Prepare pinned media and version
        run: |
          python tools/prepare_macos_media.py
          python - <<'PY'
          import os, re
          tag = os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'v\d+\.\d+\.\d+-(?:alpha|beta|rc)(?:\.[0-9A-Za-z-]+)*', tag):
              raise SystemExit('无效的预发布版本号')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'XIAOXUE_BUILD_VERSION={tag[1:]}\n')
          PY
      - name: Test including real media
        run: python -m pytest -ra
      - name: Build app and verify signature
        env:
          XIAOXUE_BUILD_PYTHON: python
        run: tools/build_macos.sh
      - name: Smoke test bundled media and frozen preview
        run: python tools/smoke_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/packages/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-macos
          path: build/macos-smoke/
          if-no-files-found: ignore

  publish:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Prepare exact changelog and both SHA256 checksums
        run: python tools/release_notes.py --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" --assets release-assets
      - name: Publish both platforms as one Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.zip \
            --verify-tag --prerelease --latest=false \
            --title "小雪工具箱 $GITHUB_REF_NAME（预发布）" --notes-file release-notes.md
