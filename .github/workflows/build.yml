name: Build and Release

# 正式版 (vX.Y.Z, 不含 alpha/beta/rc) 的双平台构建与发布:
#   windows  job → Windows x64 冻结包
#   macos    job → macOS arm64 .app 冻结包 (uv 托管 Python 3.12.12)
#   release  job → 两个平台都成功后, 统一创建 Release 并写入两份 SHA256
# 预发布 (alpha/beta/rc) 走 build-beta.yml, 两者互不干扰。

on:
  push:
    tags:
      - 'v[0-9]*'  # 匹配 v 开头的版本号
  workflow_dispatch:  # 支持手动触发 (只构建, 不发布)

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_QPA_PLATFORM: offscreen
  XIAOXUE_NO_UPDATE_CHECK: '1'
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    # 排除 beta/alpha/rc 版本 (这些由 build-beta.yml 处理)
    if: ${{ !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-rc') }}
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 构建期依赖: 锁定与 Python 3.12 兼容的 PyInstaller 大版本
          pip install "pyinstaller>=6.11.1,<7"

      # FFmpeg 固定到不可变的 BtbN autobuild 快照 + SHA256 校验 (不用 latest, 保证可复现)
      # 资产: ffmpeg-N-127579-g5cb9fcd211-win64-gpl.zip (GPL, static, win64)
      # 来源: https://github.com/BtbN/FFmpeg-Builds/releases/tag/autobuild-2026-10-16-13-04
      - name: Download FFmpeg (pinned + SHA256)
        run: |
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-16-13-04/ffmpeg-N-127579-g5cb9fcd211-win64-gpl.zip"
          $expectedSha256 = "b7c94a054ae4c1cce0e11ae18979d932e6f129ba6f5253b328227b31f1bf2bbf"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile "ffmpeg.zip"
          $actualSha256 = (Get-FileHash "ffmpeg.zip" -Algorithm SHA256).Hash.ToLower()
          if ($actualSha256 -ne $expectedSha256) {
            throw "FFmpeg SHA256 校验失败: 期望 $expectedSha256, 实际 $actualSha256"
          }
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
          $dirName = (Get-ChildItem "ffmpeg_temp" -Directory | Select-Object -First 1).Name
          New-Item -ItemType Directory -Force -Path "bin"
          Copy-Item "ffmpeg_temp\$dirName\bin\ffmpeg.exe" -Destination "bin\"
          Copy-Item "ffmpeg_temp\$dirName\bin\ffprobe.exe" -Destination "bin\"
          Remove-Item -Recurse -Force "ffmpeg_temp"
          Remove-Item "ffmpeg.zip"

      - name: Inject version to src/_version.py
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version -or $version -eq "") {
            $version = "dev"
          } else {
            $version = $version -replace '^v', ''
          }
          Write-Host "Injecting version: $version"

          $content = Get-Content "src/_version.py" -Raw -Encoding UTF8
          $content = $content -replace '__version__:\s*str\s*=\s*.*', "__version__: str = `"$version`""
          Set-Content "src/_version.py" -Value $content -Encoding UTF8 -NoNewline

          Get-Content "src/_version.py" | Select-String -Pattern '__version__'

      - name: Build with PyInstaller
        run: |
          pyinstaller XiaoXueToolbox.spec --noconfirm

      - name: Create release package
        run: |
          Compress-Archive -Path "dist\小雪工具箱\*" -DestinationPath "XiaoXueToolbox_${{ github.ref_name }}_Windows_x64.zip"
          Get-Item "XiaoXueToolbox_${{ github.ref_name }}_Windows_x64.zip" | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: XiaoXueToolbox_${{ github.ref_name }}_Windows_x64.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    if: ${{ !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-rc') }}
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 与 build-beta / Tests 一致: 用 uv 托管的 framework Python 3.12.12,
      # setup-python 的 macOS 构建不是 framework build, PyQt6 会直接 abort。
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.7'

      - name: Prepare compatible arm64 Python
        run: |
          uv python install 3.12.12
          uv venv --python 3.12.12 build/macos-venv
          echo "$PWD/build/macos-venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv pip install --python build/macos-venv/bin/python -r requirements-build-macos.txt -r requirements-dev.txt

      - name: Prepare pinned media and version
        run: |
          python tools/prepare_macos_media.py
          python - <<'PY'
          import os
          tag = os.environ['GITHUB_REF_NAME']
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'XIAOXUE_BUILD_VERSION={tag.lstrip("v")}\n')
          PY

      # 双平台门禁: 正式版发布前同样要跑全量测试 (含真实媒体用例)
      - name: Test including real media
        run: python -m pytest -ra

      - name: Build app and verify signature
        env:
          XIAOXUE_BUILD_PYTHON: python
        run: tools/build_macos.sh

      - name: Smoke test bundled media and frozen startup
        run: python tools/smoke_macos.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/packages/*.zip
          if-no-files-found: error
          retention-days: 30

  # 两个平台都成功后统一发布: 任一平台失败都不会留下半个 Release
  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Prepare exact changelog and both SHA256 checksums
        run: |
          python tools/release_notes.py --tag "${GITHUB_REF_NAME}" \
            --repository "${GITHUB_REPOSITORY}" --assets release-assets
          cat release-notes.md

      - name: Publish both platforms as one release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/*.zip --clobber
            gh release edit "$tag" --title "小雪工具箱 $tag" --notes-file release-notes.md
          else
            gh release create "$tag" release-assets/*.zip --verify-tag \
              --title "小雪工具箱 $tag" --notes-file release-notes.md
          fi
